<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --signal: #D9AC5C;
      --signal-dim: rgba(217, 172, 92, 0.22);
      --void: #060A14;
      --void-2: #0B1424;
      --panel: #0D1728;
      --panel-line: #1C2C46;
      --ink: #EAEFF8;
      --ink-dim: #64748C;
      --high: #FF5C57;
      --med: #D9AC5C;
      --low: #4FB0FF;
    }

    * { box-sizing: border-box; }

    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background:
        radial-gradient(circle at 50% -10%, rgba(79, 176, 255, 0.08), transparent 55%),
        linear-gradient(180deg, var(--void-2), var(--void) 40%);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .greeting {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 500;
      color: var(--signal);
      letter-spacing: 1.2px;
      padding: 6px 10px;
      margin-bottom: 16px;
      border: 1px solid rgba(217, 172, 92, 0.2);
      border-radius: 4px;
      background: rgba(217, 172, 92, 0.05);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .greeting::before {
      content: '';
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 6px var(--signal);
      flex-shrink: 0;
    }

    /* ---- Signal beam header ---- */
    .header {
      position: relative;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .beam {
      position: absolute;
      width: 200px; height: 200px;
      top: -104px; left: 50%;
      transform: translateX(-50%);
      background: conic-gradient(from 90deg at 50% 0%,
        transparent 0deg, var(--signal-dim) 7deg, transparent 18deg,
        transparent 342deg, var(--signal-dim) 353deg, transparent 360deg);
      animation: sweep 7s ease-in-out infinite;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .beam { animation: none; }
    }
    @keyframes sweep {
      0%   { transform: translateX(-50%) rotate(-14deg); }
      50%  { transform: translateX(-50%) rotate(14deg); }
      100% { transform: translateX(-50%) rotate(-14deg); }
    }
    .bat-logo {
      position: relative;
      width: 96px;
      fill: var(--signal);
      filter: drop-shadow(0 0 12px rgba(217, 172, 92, 0.4));
    }

    /* ---- Panels ---- */
    .panel {
      position: relative;
      background: linear-gradient(180deg, var(--panel), var(--void-2));
      border: 1px solid var(--panel-line);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .panel::before, .panel::after,
    .panel .bracket-br, .panel .bracket-bl {
      content: '';
      position: absolute;
      width: 8px; height: 8px;
      opacity: 0.9;
    }
    .panel::before { top: 6px; left: 6px; border-top: 1.5px solid var(--signal); border-left: 1.5px solid var(--signal); }
    .panel::after   { top: 6px; right: 6px; border-top: 1.5px solid var(--signal); border-right: 1.5px solid var(--signal); }
    .panel .bracket-bl { bottom: 6px; left: 6px; border-bottom: 1.5px solid var(--signal); border-left: 1.5px solid var(--signal); }
    .panel .bracket-br { bottom: 6px; right: 6px; border-bottom: 1.5px solid var(--signal); border-right: 1.5px solid var(--signal); }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.8px;
      color: var(--ink-dim);
      margin-bottom: 10px;
    }

    /* ---- Timer ---- */
    .timer-card { text-align: center; }
    #timer-display {
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 44px;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
      color: var(--ink);
      text-shadow: 0 0 18px rgba(79, 176, 255, 0.18);
    }
    #timer-display.pulse { animation: pulse 0.9s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    #timer-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.4px;
      color: var(--ink-dim);
      margin-bottom: 14px;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--signal);
      cursor: pointer;
      margin: 4px 0 16px;
    }

    .btn-action {
      background: linear-gradient(180deg, #E5C078, var(--signal));
      color: #0B1424;
      border: none;
      width: 100%;
      padding: 12px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 12.5px;
      letter-spacing: 0.8px;
      border-radius: 6px;
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.05s ease;
    }
    .btn-action:hover { filter: brightness(1.08); }
    .btn-action:active { transform: scale(0.98); }
    .btn-action:focus-visible { outline: 2px solid var(--low); outline-offset: 2px; }

    /* ---- Planner ---- */
    #task-input {
      background: #0B1422;
      border: 1px solid var(--panel-line);
      color: var(--ink);
      width: 100%;
      padding: 11px 12px;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
    }
    #task-input:focus { border-color: var(--signal); }
    #task-input::placeholder { color: var(--ink-dim); }

    .p-row { display: flex; gap: 6px; margin-bottom: 12px; }
    .p-btn {
      flex: 1;
      padding: 7px;
      background: #0B1422;
      border: 1px solid var(--panel-line);
      color: var(--ink-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      border-radius: 5px;
      cursor: pointer;
    }
    .p-btn.active { border-color: var(--signal); color: var(--signal); background: rgba(217, 172, 92, 0.08); }

    #task-list { padding: 0; list-style: none; margin: 14px 0 0; max-height: 220px; overflow-y: auto; }
    .task-item {
      background: #0B1422;
      padding: 11px 12px;
      border-radius: 6px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid #2A3B57;
      font-size: 13px;
      transition: opacity 0.2s ease;
    }
    .task-item.high { border-left-color: var(--high); }
    .task-item.med  { border-left-color: var(--med); }
    .task-item.low  { border-left-color: var(--low); }

    .delete-task {
      color: var(--ink-dim);
      cursor: pointer;
      padding: 2px 4px;
      font-size: 12px;
    }
    .delete-task:hover { color: var(--high); }
  </style>
</head>
<body>
  <div class="greeting">AUTHENTICATED: SHEILA // DEV_ACCESS_01</div>

  <div class="header">
    <div class="beam"></div>
    <svg class="bat-logo" viewBox="0 0 120 56" xmlns="http://www.w3.org/2000/svg">
      <path d="
        M60,54
        C 56,48 52,44 50,38
        C 44,40 34,42 24,38
        C 14,34 6,26 0,24
        C 4,18 12,14 20,16
        C 16,10 12,6 8,2
        C 16,0 26,4 32,12
        C 34,8 36,6 38,7
        C 40,10 40,16 38,22
        C 44,20 50,22 52,28
        C 54,22 58,18 60,18
        C 62,18 66,22 68,28
        C 70,22 76,20 82,22
        C 80,16 80,10 82,7
        C 84,6 86,8 88,12
        C 94,4 104,0 112,2
        C 108,6 104,10 100,16
        C 108,14 116,18 120,24
        C 114,26 106,34 96,38
        C 86,42 76,40 70,38
        C 68,44 64,48 60,54 Z"/>
    </svg>
  </div>

  <div class="panel timer-card">
    <span class="bracket-bl"></span><span class="bracket-br"></span>
    <div class="eyebrow">MISSION TIMER</div>
    <div id="timer-display">25:00</div>
    <div id="timer-status">STANDING BY</div>
    <input type="range" id="time-slider" min="1" max="60" value="25">
    <button class="btn-action" id="timer-toggle">START MISSION</button>
  </div>

  <div class="panel planner-card">
    <span class="bracket-bl"></span><span class="bracket-br"></span>
    <div class="eyebrow">MISSION PLANNER</div>
    <input type="text" id="task-input" placeholder="New objective..." autocomplete="off">
    <div class="p-row">
      <button class="p-btn" data-p="low">LOW</button>
      <button class="p-btn active" data-p="med">MED</button>
      <button class="p-btn" data-p="high">HIGH</button>
    </div>
    <button class="btn-action" id="add-task" style="margin-top:4px;">LOG OBJECTIVE</button>
    <ul id="task-list"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
